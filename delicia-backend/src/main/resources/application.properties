spring.application.name=delicia
server.port=8181

spring.data.mongodb.uri=mongodb://localhost:27017/delicia

jwt.secret=ThisIsAVeryLongSecretKeyForDeliciaJWTSigningThatShouldBeAtLeast256BitsLong

# --- Atlas (cloud) config — use this later when deploying ---
# Get the real string from Atlas: Cluster0 -> Connect -> Drivers -> copy connection string
# It will look like: mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/delicia?retryWrites=true&w=majority
# Replace <username> and <password> with your actual Atlas database user credentials (not your Atlas login).
# If your password has special characters (@ # % etc.), URL-encode them.
#spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<your-actual-cluster-url>/delicia?retryWrites=true&w=majority